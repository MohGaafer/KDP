<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Amazon KDP">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/kindle.png" type="image/png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/kindle.png">
  <title>Amazon KDP</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 28px; background: #171717; color: #fff; }
    main { width: min(100%, 360px); text-align: center; }
    img { width: 104px; height: 104px; border-radius: 24px; margin-bottom: 22px; }
    h1 { font-size: 27px; margin: 0 0 10px; }
    p { color: #b8b8b8; line-height: 1.5; margin: 0 0 26px; }
    a { display: block; padding: 16px 20px; border-radius: 14px; background: #f6c844; color: #171717; text-decoration: none; font-weight: 700; }
    small { display:block; margin-top: 18px; color: #888; }
  </style>
</head>
<body>
  <main>
    <img src="icons/kindle.png" alt="Kindle">
    <h1>Amazon KDP</h1>
    <p>Open your KDP bookshelf and publishing dashboard.</p>
    <a href="https://kdp.amazon.com/">Open Amazon KDP</a>
    <small>Sign in with your Amazon account.</small>
  </main>
</body>
</html>
